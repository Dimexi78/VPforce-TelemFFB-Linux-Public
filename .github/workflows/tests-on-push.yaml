name: Run tests on push

on:
  push:
    branches:
      - "**"

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libhidapi-dev libhidapi-hidraw0 libusb-1.0-0
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # A native death (a PyQt qFatal, an access violation) ends the
      # run with no test failure and no traceback.  The step shell
      # reports such exit codes as a plain 1, so print the real one -
      # and run unbuffered, or the last printed test name is only the
      # last flushed one, not where the process actually died.
      - name: Run pytest
        run: |
          pytest
        env:
          PYTHONFAULTHANDLER: "1"
          PYTHONUNBUFFERED: "1"
