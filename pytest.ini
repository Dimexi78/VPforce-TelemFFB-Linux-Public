[pytest]
# Pytest configuration for TelemFFB tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 6.0

# Add source directory to Python path
pythonpath = .

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --color=yes
    --ignore=tests/test_ffb_dinput.py
    --ignore=tests/test_ffb_tap.py
    --ignore=tests/test_tap_monitor.py
    --ignore=tests/test_tap_reconcile_prompt.py
    --ignore=tests/test_tap_workflows.py
    --ignore=tests/test_updater_backup.py
    --ignore=tests/test_device_conflict_override.py
    --ignore=tests/test_device_identity_storage.py
    --ignore=tests/test_joystick_alternates.py
    --ignore=tests/test_restart_notice.py
    --ignore=tests/test_settings_import_export.py

# Test markers
markers =
    unit: Unit tests for individual components
    integration: Integration tests for multiple components
    msfs: Tests specific to MSFS simulator
    xplane: Tests specific to X-Plane simulator
    joystick: Tests for joystick FFB effects
    pedals: Tests for pedals FFB effects
    collective: Tests for collective FFB effects
    helicopter: Tests for helicopter aircraft
    slow: Tests that take a long time to run

# Coverage options (if pytest-cov is installed)
# addopts = --cov=telemffb --cov-report=html --cov-report=term

# Warnings
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Test paths
testpaths = tests

# Log configuration
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
